<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Optimization -->
    <title>Master Mart | instant Home Delivery E-Commerce BD</title>
    <meta name="description" content="Master Mart is Bangladesh's premium high-fidelity instant home delivery e-commerce platform. Order fresh groceries, electronics, and daily essentials with 10-minute delivery. মাস্টার মার্ট - ১০ মিনিটে ক্যাশ অন ডেলিভারি, বিকাশ ও অনলাইন পেমেন্ট।" />
    <meta name="keywords" content="Master Mart, master mart bd, মাস্টার মার্ট, instant delivery BD, e-commerce Bangladesh, Blinkit Bangladesh, groceries delivery Dhaka, bKash payment e-commerce, cash on delivery groceries, steadfast courier delivery" />
    <meta name="author" content="Master Mart Group" />
    <meta name="robots" content="index, follow" />

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://master-mart-beta.vercel.app/" />
    <meta property="og:title" content="Master Mart | Bangladesh's Leading Instant Delivery Platform" />
    <meta property="og:description" content="Get your daily essentials and fresh groceries delivered in under 10 minutes. Premium, secure, and instant checkout with bKash and SSLCommerz." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1607006342411-10d3ab4b8782?auto=format&fit=crop&q=80&w=800" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://master-mart-beta.vercel.app/" />
    <meta property="twitter:title" content="Master Mart | 10-Minute Home Delivery" />
    <meta property="twitter:description" content="Order groceries and essentials instantly. Safe cash on delivery and bKash payments." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1607006342411-10d3ab4b8782?auto=format&fit=crop&q=80&w=800" />

    <!-- Structured Data (JSON-LD Schema for E-Commerce) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Master Mart BD",
        "description": "Premium 10-minute instant delivery e-commerce service in Bangladesh.",
        "image": "https://images.unsplash.com/photo-1607006342411-10d3ab4b8782?auto=format&fit=crop&q=80&w=800",
        "priceRange": "$$",
        "telephone": "+8801700000000",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Motijheel C/A",
          "addressLocality": "Dhaka",
          "postalCode": "1000",
          "addressCountry": "BD"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://master-mart-beta.vercel.app/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
